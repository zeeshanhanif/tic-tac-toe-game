<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tic-Tac-Toe</title>
    <!-- Anti-FOUC theme init (FEAT-007 D1): set data-theme before first paint so a
         persisted non-OS choice doesn't flash the OS theme. Dependency-free; must
         stay in sync with ui/theme.ts (THEME_KEY, resolveInitialTheme). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ttt:theme:v1");
          var t = raw && JSON.parse(raw);
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
