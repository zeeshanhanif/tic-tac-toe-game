name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run gen:tokens
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # UI/E2E smoke over the critical flows (ADR-006). test:e2e rebuilds + previews.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
